---
repo_url: https://github.com/Projetos-de-Extensao/PC_ADS_26.2_8001_II
site_url: https://projetos-de-extensao.github.io/PC_ADS_26.2_8001_II/
site_author: Equipe Lavoura Inteligente
site_name: PC_ADS_26.2_8001_II
copyright: Copyright © 2026, Equipe Lavoura Inteligente

nav:
  - Home: index.md
  - Iniciação:
      - Index: Iniciacao/index.md
      - Documento de Visão: Iniciacao/dv.md
      - Requisitos Suplementares: Iniciacao/rs.md
  - Elaboração:
      - Index: Elaboracao/index.md
      - Arquitetura: Elaboracao/arquitetura.md
      - Requisitos Funcionais: Elaboracao/levreq.md
      - Casos de Uso Arquiteturais: Elaboracao/cua.md
      - Pacotes e Subsistemas: Elaboracao/maps.md
      - Dimensionamento de Computação (EC2): Elaboracao/dim_comp.md
      - Dimensionamento de Banco de Dados: Elaboracao/dimrbd.md
      - Sequência e Comunicação: Elaboracao/seq_com.md
  - Construção:
      - Index: Construcao/index.md
      - GitHub Workflows: Construcao/github_workflows.md
      - GitHub Projects: Construcao/github_projects.md
      - CodeSpace: Construcao/codespace.md
      - Deploy EC2 + Docker (SQLite): Construcao/deploy_ec2_sqlite.md
      - Deploy EC2 + Docker (PostgreSQL): Construcao/deploy_ec2_postgres.md
  - Transição:
      - Index: Transicao/index.md
      - Estratégias de Deploy: Transicao/ativ_deploy.md

extra_css:
  - css/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      puml_keyword: plantuml
  - minify:
      minify_html: true
  - search
  - mkdocs-jupyter:
      execute: false
      allow_errors: true

theme:
  name: material
  language: pt-BR
  favicon: assets/ibmec_icon.png
  logo: assets/Ibmec_logo.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/toggle-switch
        name: Usar tema claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: black
      toggle:
        icon: material/toggle-switch-off
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: Usar tema do sistema
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
